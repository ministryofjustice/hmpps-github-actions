name: Build & push docker image to ECR

on:
  workflow_call:
    inputs:
      docker_registry:
        description: Docker registry. Retained for backwards compatibility - this workflow only supports 'ecr'
        required: false
        type: string
        default: 'ecr'
      registry_org:
        description: Docker registry organisation (not used for ECR, retained for parity with docker_build.yml)
        required: false
        default: 'hmpps'
        type: string
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable tags
        required: false
        type: string
      tag_latest:
        description: Tag docker image as 'latest'
        required: false
        type: boolean
        default: true
      upload_image_artifact:
        description: Upload image to artifacts in GitHub Actions
        required: false
        type: boolean
        default: false
      image_artifact_retention_days:
        description: Number of days to keep the image in artifacts
        required: false
        type: number
        default: 7
      additional_docker_build_args:
        description: Additional docker build arguments
        required: false
        type: string
      additional_docker_secrets_args:
        description: Additional docker build secrets arguments
        required: false
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        type: boolean
      load:
        description: Load docker image into local docker
        required: false
        type: boolean
        default: false
      docker_multiplatform:
        description: Docker image build multiplatform or not
        required: true
        type: boolean
        default: true
      image_name:
        description: ECR repository name, e.g. hmpps-sre/my-app. Defaults to the ECR_REPOSITORY variable
        required: false
        type: string
      image_version:
        description: Version tag of the image. Generated when not provided
        required: false
        type: string
        default: ''
      file:
        description: "Path to the Dockerfile"
        required: false
        type: string
      download_build_artifacts:
        description: Whether to download the build artifacts prior to running the docker build
        required: false
        type: boolean
        default: false
      generate_sbom:
        description: Generate an SBOM for the final pushed image and upload it as a workflow artifact
        required: false
        type: boolean
        default: false
      attach_sbom_to_registry:
        description: Create and push an SBOM attestation for the pushed image in the container registry (caller also needs attestations write permission)
        required: false
        type: boolean
        default: false
      sign_image:
        description: Sign pushed image digest in the container registry
        required: false
        type: boolean
        default: false

    secrets:
      ECR_ROLE_TO_ASSUME:
        required: false
      ECR_REGISTRY_URL:
        description: Deprecated - use the CLOUD_PLATFORM_ECR_REGISTRY_URL variable instead. Used only when that variable is not set
        required: false

    outputs:
      app_version:
        description: The version of the app as generated by create_app_version
        value: ${{ jobs.create_version.outputs.version }}

# No top-level permissions block: jobs inherit the caller's permissions, as declaring one here would
# reset anything not listed (e.g. attestations: write) to none. Callers must grant id-token: write for ECR,
# and attestations: write if attach_sbom_to_registry is used.
jobs:
  ## Always create an app_version, and resolve the ECR repository name
  #####################################################################
  create_version:
    name: Create app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.image_version.outputs.version }}
      ecr_repository: ${{ steps.image_version.outputs.ecr_repository }}
    steps:
      - id: app_version
        name: Create application version
        if: inputs.image_version == ''
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/create_app_version@38a8e31c789777d02669f8b2de309d66ebf00f55 # v1.1.8
      - id: image_version
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.image_version || steps.app_version.outputs.version }}
          ECR_REPOSITORY: ${{ inputs.image_name || vars.ECR_REPOSITORY || github.event.repository.name }}
        run: |
          echo "version=${IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "ecr_repository=${ECR_REPOSITORY}" >> $GITHUB_OUTPUT

##################################### SINGLE PLATFORM ##########################################
# Single platform builds have a combined build / push, since it can do both in one step

  docker_build:
    name: Build linux/amd64 (single)
    if: ${{ ! inputs.docker_multiplatform }}
    needs: [create_version]
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.build_docker_step.outputs.digest }}
    steps:
      - id: build_docker_step
        name: Build (and push) Docker (ECR)
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/build_docker@38a8e31c789777d02669f8b2de309d66ebf00f55 # v1.1.8
        with:
          image_name: ${{ needs.create_version.outputs.ecr_repository }}
          docker_registry: ecr
          registry_org: ${{ inputs.registry_org }}
          file: ${{ inputs.file }}
          additional_docker_tag: ${{ inputs.additional_docker_tag }}
          tag_latest: ${{ inputs.tag_latest }}
          upload_image_artifact: ${{ inputs.upload_image_artifact }}
          image_artifact_retention_days: ${{ inputs.image_artifact_retention_days }}
          push: ${{ inputs.push }}
          load: ${{ inputs.load }}
          app_version: ${{ needs.create_version.outputs.version }}
          additional_docker_build_args: ${{ inputs.additional_docker_build_args }}
          additional_docker_secrets_args: ${{ inputs.additional_docker_secrets_args }}
          download_build_artifacts: ${{ inputs.download_build_artifacts }}
          ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          ECR_REGISTRY_URL: ${{ vars.CLOUD_PLATFORM_ECR_REGISTRY_URL || secrets.ECR_REGISTRY_URL }}

##################################### MULTIPLATFORM ############################################
# Multiplatform builds have separate build / push processes.

  docker_build_multiplatform:
    name: Build ${{ matrix.platform }} (parallel)
    if: ${{ inputs.docker_multiplatform }}
    needs: [create_version]
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download build artifacts needed for docker build
        if: ${{ inputs.download_build_artifacts }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-results

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare platform pair
        id: prepare
        shell: bash
        run: |
            echo "platform_pair=${platform//\//-}" >> "${GITHUB_OUTPUT}"
        env:
          platform: ${{ matrix.platform }}

      - name: Build docker archive tarball
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          file: ${{ inputs.file }}
          build-args: |
            "BUILD_NUMBER=${{ needs.create_version.outputs.version }}"
            "GIT_REF=${{ github.sha }}"
            "GIT_BRANCH=${{ github.ref_name }}"
            "${{ inputs.additional_docker_build_args }}"
          secret-envs: ${{ inputs.additional_docker_secrets_args }}
          outputs: type=docker,name=ecr/${{ needs.create_version.outputs.ecr_repository }}:${{ needs.create_version.outputs.version }},dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=build-${{ steps.prepare.outputs.platform_pair }}
          cache-to: type=gha,scope=build-${{ steps.prepare.outputs.platform_pair }},mode=max
          provenance: false

      - name: Upload image tarball
        if: ${{ inputs.push || inputs.upload_image_artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ steps.prepare.outputs.platform_pair }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: ${{ inputs.upload_image_artifact && inputs.image_artifact_retention_days || 1 }}

  docker_build_merge:
    name: Push multi-platform image
    if: ${{ inputs.docker_multiplatform && inputs.push }}
    needs: [create_version, docker_build_multiplatform]
    uses: ./.github/workflows/docker_push_ecr.yml
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
    with:
      ecr_registry_url: ${{ vars.CLOUD_PLATFORM_ECR_REGISTRY_URL }}
      ecr_repository: ${{ needs.create_version.outputs.ecr_repository }}
      app_version: ${{ needs.create_version.outputs.version }}
      tag_latest: ${{ inputs.tag_latest }}
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      docker_multiplatform: true

##################################### IMAGE SIGNING ############################################

  sign_image_single_platform:
    name: Sign image (single-platform)
    if: ${{ inputs.sign_image && !inputs.docker_multiplatform && inputs.push }}
    needs: [create_version, docker_build]
    uses: ./.github/workflows/docker_sign_ecr.yml
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
    with:
      ecr_registry_url: ${{ vars.CLOUD_PLATFORM_ECR_REGISTRY_URL }}
      ecr_repository: ${{ needs.create_version.outputs.ecr_repository }}
      image_digest: ${{ needs.docker_build.outputs.image_digest }}

  sign_image_multi_platform:
    name: Sign image (multi-platform)
    if: ${{ inputs.sign_image && inputs.docker_multiplatform && inputs.push }}
    needs: [create_version, docker_build_merge]
    uses: ./.github/workflows/docker_sign_ecr.yml
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
    with:
      ecr_registry_url: ${{ vars.CLOUD_PLATFORM_ECR_REGISTRY_URL }}
      ecr_repository: ${{ needs.create_version.outputs.ecr_repository }}
      image_digest: ${{ needs.docker_build_merge.outputs.image_digest }}

##################################### SBOM GENERATION ##########################################

  generate_sbom_single_platform:
    name: Generate SBOM (single-platform image)
    if: ${{ inputs.generate_sbom && !inputs.docker_multiplatform && inputs.push }}
    needs: [create_version, docker_build]
    uses: ./.github/workflows/docker_sbom_ecr.yml
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
    with:
      ecr_registry_url: ${{ vars.CLOUD_PLATFORM_ECR_REGISTRY_URL }}
      ecr_repository: ${{ needs.create_version.outputs.ecr_repository }}
      app_version: ${{ needs.create_version.outputs.version }}
      image_digest: ${{ needs.docker_build.outputs.image_digest }}
      attach_sbom_to_registry: ${{ inputs.attach_sbom_to_registry }}

  generate_sbom_multi_platform:
    name: Generate SBOM (multi-platform image)
    if: ${{ inputs.generate_sbom && inputs.docker_multiplatform && inputs.push }}
    needs: [create_version, docker_build_merge]
    uses: ./.github/workflows/docker_sbom_ecr.yml
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
    with:
      ecr_registry_url: ${{ vars.CLOUD_PLATFORM_ECR_REGISTRY_URL }}
      ecr_repository: ${{ needs.create_version.outputs.ecr_repository }}
      app_version: ${{ needs.create_version.outputs.version }}
      image_digest: ${{ needs.docker_build_merge.outputs.image_digest }}
      attach_sbom_to_registry: ${{ inputs.attach_sbom_to_registry }}
