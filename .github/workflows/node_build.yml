name: Build and test node

on:
  workflow_call:
    inputs:
      node_version_file:
        description: "Passed to setup-node action to specify where to source the version of node from"
        required: false
        type: string
        default: ".nvmrc"
      npm_version:
        description: "Passed to npm install so it knows which version of npm to install"
        required: false
        type: string
        default: "^11"
      install_command:
        description: "The command used to install npm dependencies"
        required: false
        type: string
        default: "npm ci --no-audit"
      artifact_path:
        description: "The paths to the build artifacts"
        required: false
        type: string
        default: |
          build/
          dist/
          assets/stylesheets/

permissions:
  contents: read

jobs:
  node-build:
    name: Run the node build 
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js ${{ inputs.node_version_file }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node_version_file }}
    - name: update npm
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm_version }}
      run: |
        npm install -g "npm@$NPM_VERSION"
    - name: restore cache
      id: restore-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env: 
        cache-name: node-modules
      with:
        path: |
          ./node_modules
          ~/.cache/Cypress
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '!**/node_modules/**') }}
    - name: install dependencies
      if: steps.restore-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install_command }}
      run: |
        bash -lc "${INSTALL_COMMAND}"
    - name: build npm
      shell: bash
      run: |
        npm run build
    - name: Linter check # Run linter after build because the integration test code depend on compiled typescript...
      shell: bash
      run: | 
        npm run lint
    - name: upload the artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with: 
        name: npm_build_artifacts
        path: "${{ inputs.artifact_path }}"
    - name: save cache
      id: save-cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env: 
        cache-name: node-modules
      with:
        path: |
          ./node_modules
          ~/.cache/Cypress
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '!**/node_modules/**') }}
