name: Create ephemeral deployment (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number (required for issue_comment events where github.event.pull_request is unavailable)"
        required: false
        type: string

jobs:
  prepare_deployment_context:
    name: Prepare deployment context/variables
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      RELEASE_NAME: ${{ github.event.repository.name }}-pr-${{ inputs.pr_number || github.event.pull_request.number }}
    outputs:
      release_name: ${{ steps.set-outputs.outputs.release_name }}
      ingress_host: ${{ steps.set-outputs.outputs.ingress_host }}
      processed_yaml_b64: ${{ steps.set-outputs.outputs.processed_yaml_b64 }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Apply substitutions
        run: |
          # Substitute PR_NUMBER and RELEASE_NAME using yq
          yq -i "(.generic-service.nameOverride | select(. == \"\$RELEASE_NAME\")) = \"$RELEASE_NAME\"" helm_deploy/values-pr.yaml
          yq -i "(.generic-service.ingress.host | select(contains(\"\$PR_NUMBER\"))) |= sub(\"\\\$PR_NUMBER\", \"$PR_NUMBER\")" helm_deploy/values-pr.yaml
          yq -i "(.generic-service.env.INGRESS_URL | select(contains(\"\$PR_NUMBER\"))) |= sub(\"\\\$PR_NUMBER\", \"$PR_NUMBER\")" helm_deploy/values-pr.yaml
          yq -i "(.generic-service.env.DEPLOYMENT_NAME | select(contains(\"\$PR_NUMBER\"))) |= sub(\"\\\$PR_NUMBER\", \"$PR_NUMBER\")" helm_deploy/values-pr.yaml
          yq -i "(.generic-prometheus-alerts.targetApplication | select(. == \"\$RELEASE_NAME\")) = \"$RELEASE_NAME\"" helm_deploy/values-pr.yaml

          cat helm_deploy/values-pr.yaml

      - name: Set Outputs
        id: set-outputs
        run: |
          echo "ingress_host=$(yq '.generic-service.ingress.host' helm_deploy/values-pr.yaml)" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "processed_yaml_b64=$(base64 -w 0 < helm_deploy/values-pr.yaml)" >> $GITHUB_OUTPUT

  build_docker:
    name: Build docker image
    needs:
      - prepare_deployment_context
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      tag_latest: false
      push: true
      docker_multiplatform: false

  deploy_ephemeral:
    name: Create ephemeral deployment
    needs:
      - build_docker
      - prepare_deployment_context
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@ephemeral-deployment
    secrets: inherit
    with:
      environment: 'dev'
      environment_url: 'https://${{ needs.prepare_deployment_context.outputs.ingress_host }}'
      app_version: '${{ needs.build_docker.outputs.app_version }}'
      helm_release_name: ${{ needs.prepare_deployment_context.outputs.release_name }}
      helm_values_file_b64: ${{ needs.prepare_deployment_context.outputs.processed_yaml_b64 }}
      ephemeral: true

  comment_pr:
    name: Post environment details on PR
    needs:
      - prepare_deployment_context
      - deploy_ephemeral
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      RELEASE_NAME: ${{ needs.prepare_deployment_context.outputs.release_name }}
      INGRESS_HOST: ${{ needs.prepare_deployment_context.outputs.ingress_host }}
      CHART_PATH: helm_deploy/${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or update environment comment
        run: |
          body="$(cat <<EOF
          <!-- ephemeral-env -->
          **Ephemeral environment is live:** https://$INGRESS_HOST

          Change an env var for this deployment (persists across pushes):
          \`\`\`bash
          helm upgrade $RELEASE_NAME ./$CHART_PATH --reuse-values --set generic-service.env.KEY=value
          \`\`\`

          See current overrides: \`helm get values $RELEASE_NAME\`
          Reset to committed values: push a change to \`helm_deploy/values-pr.yaml\`
          EOF
          )"

          comment_id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- ephemeral-env -->")) | .id' | head -n1)

          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body"
          else
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body"
          fi
