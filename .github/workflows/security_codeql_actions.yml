name: Security CodeQL Github Actions scan

on:
  workflow_call:
    inputs:
      channel_id:
        description: 'The slack channel ID to send a message on failure. If this is not provided then no message is sent.'
        required: false
        default: 'NO_SLACK'
        type: string
      queries:
        description: 'Option for extended queries'
        required: false
        default: ''
        type: string
    secrets:
      HMPPS_SRE_SLACK_BOT_TOKEN:
        description: 'Slack bot token'
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  security-codeql-scan:
    name: Security CodeQL Github Actions scan
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: actions 
        queries: ${{ inputs.queries }}
    - name: Perform CodeQL Analysis
      id: codeql_analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
    - name: CodeQL slack notification
      uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/slack_codescan_notification@38a8e31c789777d02669f8b2de309d66ebf00f55 # v1.1.8
      if: (failure() || steps.codeql_analysis.outcome == 'failure') && inputs.channel_id != 'NO_SLACK'
      with:
        title: "CodeQL Actions Scan"
        warningOnly: ${{ steps.codeql_analysis.outcome == 'success' }}
        channel_id: ${{ inputs.channel_id}}
        SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}