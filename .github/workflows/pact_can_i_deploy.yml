name: Pact - Can I Deploy

# Reusable workflow that any consumer repo can call to gate a deployment on
# Pact Broker verification results before releasing to a target environment.
#
# Example usage from a consumer repo:
#
# jobs:
#   can-i-deploy:
#     uses: ministryofjustice/hmpps-github-actions/.github/workflows/pact_can_i_deploy.yml@v2
#     with:
#       pacticipant: hmpps-my-consumer-service
#       version: ${{ github.sha }}
#       to_environment: production
#     secrets:
#       PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
#       HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
#       HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}

env:
  PACT_CLI_VERSION: '18.1.1'

on:
  workflow_call:
    inputs:
      pacticipant:
        description: The name of the pacticipant (consumer or provider) to check, as registered in the Pact Broker
        required: true
        type: string
      version:
        description: The version of the pacticipant to check (typically the git commit SHA)
        required: false
        type: string
        default: ${{ github.sha }}
      to_environment:
        description: The target deployment environment to check compatibility against
        required: false
        type: string
        default: 'dev'
      node_version:
        description: Node.js version used to run the Pact CLI
        required: false
        type: string
        default: '24'
    secrets:
      PACT_BROKER_URL:
        required: true
      HMPPS_PACT_BROKER_USERNAME:
        required: true
      HMPPS_PACT_BROKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  can_i_deploy:
    name: Can I deploy ${{ inputs.pacticipant }} to ${{ inputs.to_environment }}?
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Can I deploy?
        shell: bash
        run: |
          npx --yes --package "@pact-foundation/pact-cli@${PACT_CLI_VERSION}" pact-broker can-i-deploy \
            --pacticipant "${{ inputs.pacticipant }}" \
            --version "${{ inputs.version }}" \
            --to-environment "${{ inputs.to_environment }}"
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
