name: Pact - Can I Deploy

# Reusable workflow that any consumer repo can call to gate a deployment on
# Pact Broker verification results before releasing to a target environment.
#
# Example usage from a consumer repo:
#
# jobs:
#   can-i-deploy:
#     uses: ministryofjustice/hmpps-github-actions/.github/workflows/pact_can_i_deploy.yml@v2
#     with:
#       app_version: ${{ github.sha }}
#       to_environment: production
#     secrets:
#       PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
#       HMPPS_PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
#       HMPPS_PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}

on:
  workflow_call:
    inputs:
      app_version:
        description: |
          The pacticipant version to check against the Pact Broker. Must be
          the full git commit SHA (github.sha) that was used when publishing
          pacts / verification results - not a composite build version such
          as one generated by create_app_version.
        required: false
        type: string
        default: ${{ github.sha }}
      to_environment:
        description: The target deployment environment to check compatibility against
        required: false
        type: string
        default: 'dev'
    secrets:
      PACT_BROKER_URL:
        required: true
      HMPPS_PACT_BROKER_USERNAME:
        required: true
      HMPPS_PACT_BROKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  can_i_deploy:
    name: Can I deploy to ${{ inputs.to_environment }}?
    runs-on: ubuntu-latest
    container:
      image: pactfoundation/pact-cli:1.5.0.5@sha256:77b98079e5be279353f61e116a0b9b3af19e55b215532b30d430ff5df66e5ac9
    steps:
      - name: Can I deploy?
        shell: sh
        run: |
          pacticipant="${GITHUB_REPOSITORY#*/}"

          pact-broker can-i-deploy \
            --pacticipant "$pacticipant" \
            --version "${{ inputs.app_version }}" \
            --to-environment "${{ inputs.to_environment }}"
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.HMPPS_PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.HMPPS_PACT_BROKER_PASSWORD }}
