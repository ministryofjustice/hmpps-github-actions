name: Sign container image

on:
  workflow_call:
    inputs:
      ecr_registry_url:
        description: ECR registry URL, e.g. 754256621582.dkr.ecr.eu-west-2.amazonaws.com. Falls back to the ECR_REGISTRY_URL secret when empty
        required: false
        type: string
        default: ''
      ecr_repository:
        description: ECR repository name, e.g. hmpps-sre/james-typescript-test
        required: true
        type: string
      aws_region:
        description: AWS region of the ECR registry
        required: false
        type: string
        default: eu-west-2
      image_digest:
        description: Image digest (sha256:<64 hex chars>) to sign
        required: true
        type: string
    secrets:
      ECR_ROLE_TO_ASSUME:
        required: true
      ECR_REGISTRY_URL:
        description: Deprecated - used only when the ecr_registry_url input is empty
        required: false

jobs:
  sign_image:
    name: Sign image
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: ${{ inputs.ecr_registry_url || secrets.ECR_REGISTRY_URL }}/${{ inputs.ecr_repository }}
    steps:
      - name: Validate image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid digest format: ${IMAGE_DIGEST} (expected sha256:<64 hex chars>)" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Sign image with cosign keyless
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
