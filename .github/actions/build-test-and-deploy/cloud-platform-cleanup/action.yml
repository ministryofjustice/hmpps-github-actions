name: Cloud Platform Cleanup
description: Uninstall from Cloud Platform using Helm

inputs:
  api:
    description: The KUBE_ENV_API
    required: true
  cert:
    description: The KUBE_CERT
    required: true
  cluster:
    description: The KUBE_CLUSTER
    required: true
  namespace:
    description: The KUBE_NAMESPACE
    required: true
  token:
    description: The KUBE_TOKEN
    required: true
  helm_timeout:
    description: helm timeout period
    required: false
    default: 5m
  release_name:
    description: The name used for the Helm release
    required: false
    default: 'PROJECT_NAME'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/tool-installers/setup-helm@c89a206b6b32888d13f6aec01af0f7694df6b42f # v1.0.19
    - uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/tool-installers/setup-kubectl@c89a206b6b32888d13f6aec01af0f7694df6b42f # v1.0.19

    - name: Authenticate
      uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/cloud-platform-auth@c89a206b6b32888d13f6aec01af0f7694df6b42f # v1.0.19
      with:
        api: ${{ inputs.api }}
        cert: ${{ inputs.cert }}
        cluster: ${{ inputs.cluster }}
        namespace: ${{ inputs.namespace }}
        token: ${{ inputs.token }}

    - name: Uninstall
      shell: bash
      env:
        RELEASE_NAME: ${{ inputs.release_name }}
        HELM_TIMEOUT: ${{ inputs.helm_timeout }}
      run: |
        helm uninstall "$RELEASE_NAME" --timeout "$HELM_TIMEOUT" || echo "Helm release not found"