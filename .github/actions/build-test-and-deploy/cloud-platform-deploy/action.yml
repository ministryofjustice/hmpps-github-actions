name: Cloud Platform Deploy
description: Deploy to Cloud Platform using Helm

inputs:
  environment:
    description: The environment to deploy to (dev/staging/preprod/prod)
    required: true
  version:
    description: The version of the service to deploy
    required: true
  api:
    description: The KUBE_ENV_API
    required: true
  cert:
    description: The KUBE_CERT
    required: true
  cluster:
    description: The KUBE_CLUSTER
    required: true
  namespace:
    description: The KUBE_NAMESPACE
    required: true
  token:
    description: The KUBE_TOKEN
    required: true
  k8s_deployment_name:
    description: "Kubernetes deployment name, also Helm release name"
    required: true
  changelog_git_paths:
    default: ""
    description: When set it will limit the file changes shown in the changelog to the specified paths only. This is useful for multi-project builds where otherwise it will show all changes from all projects.
    required: false
  show_changelog:
    description: Whether the changelog should be sent by slack
    required: false
  helm_release_name:
    description: "Release name for helm deployment"
    required: false
  helm_additional_args:
    description: any additional helm arguments
    required: false
    default: ""
  helm_timeout:
    description: helm timeout period
    required: false
    default: 5m
  helm_dir:
    description: location of helm configuration
    required: false
    default: helm_deploy
  helm_chart_name:
    description: location of helm chart within the helm_dir
    required: true
  helm_allowlist_groups:
    description: values for location of allowlist groups file
    required: false
  helm_allowlist_version:
    description: setting for version of allowlist file
    required: false
  autogenerate_scheduled_downtime_cron:
    description: "Whether to set the deterministic scheduled downtime cron values"
    required: false
    default: true
  helm_values_file_b64:
    description: "Base64-encoded values file content to use for deployment"
    required: false
  ephemeral:
    description: "Marks this as an ephemeral (e.g. per-PR) deployment"
    required: false
    default: "false"

outputs:
  deployment_changelog:
    description: "The changelog for the deployment"
    value: ${{ steps.version_history.outputs.deployment_changelog }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Authenticate
      uses: ministryofjustice/hmpps-github-actions/.github/actions/build-test-and-deploy/cloud-platform-auth@v2 # WORKFLOW_VERSION
      with:
        api: ${{ inputs.api }}
        cert: ${{ inputs.cert }}
        cluster: ${{ inputs.cluster }}
        namespace: ${{ inputs.namespace }}
        token: ${{ inputs.token }}

    - name: get version history
      uses: ministryofjustice/hmpps-github-actions/.github/actions/version_history@v2 # WORKFLOW VERSION
      if: ${{ inputs.show_changelog }}
      id: version_history
      with:
        app_version: ${{ inputs.version }}
        environment: ${{ inputs.environment }}
        namespace: ${{ inputs.namespace }}
        k8s_deployment_name: ${{ inputs.k8s_deployment_name }}
        changelog_git_paths: ${{ inputs.changelog_git_paths }}

    - name: Check for IP_ALLOWLIST_GROUPS_YAML
      shell: bash
      id: check-ip-allowlists
      env:
        HELM_ALLOWLIST_GROUPS: ${{ inputs.helm_allowlist_groups }}
      run: |
        if [[ -n "$HELM_ALLOWLIST_GROUPS" ]]; then
          echo "$HELM_ALLOWLIST_GROUPS" | base64 --decode > ./ip-allowlist-groups.yaml
          echo "ALLOWLIST_GROUPS=--values ./ip-allowlist-groups.yaml" >> $GITHUB_OUTPUT
        fi

    - name: Check for IP_ALLOWLIST_GROUPS_VERSION
      shell: bash
      id: check-ip-allowlists-version
      env:
        HELM_ALLOWLIST_VERSION: ${{ inputs.helm_allowlist_version }}
      run: |
        if [[ -n "$HELM_ALLOWLIST_VERSION" ]]; then
          echo "ALLOWLIST_VERSION=--set generic-service.allowlist_version=$HELM_ALLOWLIST_VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Decode base64 values file
      shell: bash
      id: decode-values-file
      env:
        HELM_VALUES_FILE_B64: ${{ inputs.helm_values_file_b64 }}
      run: |
        if [[ -n "$HELM_VALUES_FILE_B64" ]]; then
          echo "$HELM_VALUES_FILE_B64" | base64 --decode > ./helm-values-decoded.yaml
          echo "VALUES_FILE=--values ./helm-values-decoded.yaml" >> $GITHUB_OUTPUT
        fi

    - name: Get latest Helm v4 version
      shell: bash
      id: helm-version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LATEST_V4=$(gh api repos/helm/helm/releases --jq '[.[] | select(.tag_name | startswith("v4.")) | select(.prerelease == false) | .tag_name] | first')
        echo "version=${LATEST_V4}" >> $GITHUB_OUTPUT
        echo "Latest Helm v4 version: ${LATEST_V4}"

    - uses: azure/setup-helm@v4
      with:
        version: ${{ steps.helm-version.outputs.version }}

    - name: Set Helm release name
      id: set-helm-release-name
      shell: bash
      env:
        HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
        HELM_CHART_NAME: ${{ inputs.helm_chart_name }}
      run: |
        if [[ -z "$HELM_RELEASE_NAME" ]]; then
          echo "helm_release_name=$HELM_CHART_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "helm_release_name=$HELM_RELEASE_NAME" >> "$GITHUB_OUTPUT"
        fi

    - name: Check ephemeral values for changes
      if: ${{ inputs.ephemeral == 'true' }}
      id: ephemeral-values
      shell: bash
      env:
        HELM_DIR: ${{ inputs.helm_dir }}
        ENVIRONMENT: ${{ inputs.environment }}
        HELM_RELEASE_NAME: ${{ steps.set-helm-release-name.outputs.helm_release_name }}
      run: |
        values_files=("$HELM_DIR/values-$ENVIRONMENT.yaml")
        if [[ -f ./ip-allowlist-groups.yaml ]]; then
          values_files+=(./ip-allowlist-groups.yaml)
        fi
        if [[ -f ./helm-values-decoded.yaml ]]; then
          values_files+=(./helm-values-decoded.yaml)
        fi

        current_hash=$(cat "${values_files[@]}" | sha256sum | awk '{print $1}')
        previous_hash=$(helm get values "$HELM_RELEASE_NAME" -o json 2>/dev/null | jq -r '.deployedValuesHash // empty' || true)

        if [[ -n "$previous_hash" && "$current_hash" == "$previous_hash" ]]; then
          echo "Values files unchanged since last deploy - stored release values (including ad-hoc overrides) will be reused"
          echo "reuse=true" >> "$GITHUB_OUTPUT"
        else
          echo "First deploy or values files changed - performing full values deployment"
          echo "reuse=false" >> "$GITHUB_OUTPUT"
        fi

        echo "hash=$current_hash" >> "$GITHUB_OUTPUT"

    - name: Deploy
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        VERSION: ${{ inputs.version }}
        HELM_DIR: ${{ inputs.helm_dir }}
        HELM_CHART_NAME: ${{ inputs.helm_chart_name }}
        HELM_RELEASE_NAME: ${{ steps.set-helm-release-name.outputs.helm_release_name }}
        HELM_TIMEOUT: ${{ inputs.helm_timeout }}
        HELM_ADDITIONAL_ARGS: ${{ inputs.helm_additional_args }}
        K8S_DEPLOYMENT_NAME: ${{ inputs.k8s_deployment_name }}
        AUTOGENERATE_DOWNTIME_CRON: ${{ inputs.autogenerate_scheduled_downtime_cron }}
        EPHEMERAL: ${{ inputs.ephemeral }}
        REUSE_STORED_VALUES: ${{ steps.ephemeral-values.outputs.reuse }}
        VALUES_HASH: ${{ steps.ephemeral-values.outputs.hash }}
        ALLOWLIST_GROUPS: ${{ steps.check-ip-allowlists.outputs.ALLOWLIST_GROUPS }}
        ALLOWLIST_VERSION: ${{ steps.check-ip-allowlists-version.outputs.ALLOWLIST_VERSION }}
        VALUES_FILE: ${{ steps.decode-values-file.outputs.VALUES_FILE }}
      run: |
        yq -i ".appVersion = \"$VERSION\"" "$HELM_DIR/$HELM_CHART_NAME/Chart.yaml"
        helm dependency update "$HELM_DIR/$HELM_CHART_NAME"

        # Split additional args into an array
        read -r -a helm_args <<< "$HELM_ADDITIONAL_ARGS"

        # For services that have the startup/shutdown script enabled.
        # Autogenerate schedule downtime cron. This is a pseudo-random, deterministic number used in the cron start/shutdown minute.
        # This is to help ensure the startup/shutdown pods do not all run at the exact same time - which can cause cluster auto-scalling issues.
        if [[ "$AUTOGENERATE_DOWNTIME_CRON" == "true" ]]; then
          cron_minute=$(echo -n "$K8S_DEPLOYMENT_NAME" | md5sum | awk '{print $1}' | tr -dc '0-9' | head -c 3)
          cron_minute=$((cron_minute % 60))
          startup_cron="$cron_minute 6 * * 1-5"
          shutdown_cron="$cron_minute 21 * * 1-5"
          helm_args+=(--set "generic-service.scheduledDowntime.startup=${startup_cron}")
          helm_args+=(--set "generic-service.scheduledDowntime.shutdown=${shutdown_cron}")
        fi

        # Flag-string outputs (e.g. "--values ./file.yaml") need word-splitting into arrays
        read -r -a allowlist_groups_args <<< "$ALLOWLIST_GROUPS"
        read -r -a allowlist_version_args <<< "$ALLOWLIST_VERSION"
        read -r -a values_file_args <<< "$VALUES_FILE"

        # Ephemeral releases with unchanged values files reuse the release's stored
        # values so ad-hoc overrides (helm upgrade --reuse-values --set ...) survive
        # redeploys. Any change to the values files resets the release to committed state.
        if [[ "$REUSE_STORED_VALUES" == "true" ]]; then
          values_args=(--reuse-values)
        else
          values_args=(--reset-values --values "$HELM_DIR/values-$ENVIRONMENT.yaml")
          values_args+=("${allowlist_groups_args[@]}")
          values_args+=("${values_file_args[@]}")
          if [[ "$EPHEMERAL" == "true" ]]; then
            values_args+=(--set "deployedValuesHash=$VALUES_HASH")
          fi
        fi

        exec helm upgrade \
          "$HELM_RELEASE_NAME" \
          "$HELM_DIR/$HELM_CHART_NAME" \
          --rollback-on-failure \
          --history-max 10 \
          --install \
          --set "generic-service.image.tag=$VERSION" \
          --set "version=$VERSION" \
          --set "global.environment=$ENVIRONMENT" \
          --timeout "$HELM_TIMEOUT" \
          "${values_args[@]}" \
          "${helm_args[@]}" \
          "${allowlist_version_args[@]}" \
          --wait
